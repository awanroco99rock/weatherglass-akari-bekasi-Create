name: Build Akari AX512
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          unzip -o weatherglass-tv-main.zip
          cp -r weatherglass-tv-main/* . || true
          chmod +x build.sh
          echo "city=Bekasi Timur
          latitude=-6.2383
          longitude=107.0356
          language=id
          temperature=celsius
          prayer_times=true" > config.properties
          ./build.sh
          ls -lh *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Bekasi-Timur-OS10
          path: "*.apk"
